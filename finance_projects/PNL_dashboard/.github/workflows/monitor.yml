name: BTC AbsDD Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"   # ogni ora al minuto 7 UTC

concurrency:
  group: btc-absdd-monitor
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTC monitor
        env:
          SYMBOL: BTCUSDT
          CATEGORY: spot
          INTERVAL: 60
          BARS: 2500
          REQUEST_TIMEOUT: 20

          EMA_FAST: 20
          EMA_SLOW: 50

          Z_LOOKBACK: 150
          Z_K1: 0.5
          Z_K2: 1.0

          DASHBOARD_BARS: 220
          SAVE_DASHBOARD: 1
          SHOW_DASHBOARD: 0
          DASHBOARD_PATH: btc_absdd_dashboard.png

          EXEC_MODE: Close
          IGNORE_NEUTRAL: 1

          PNL_MODE: Raw
          VOL_METRIC: ATR%
          VOL_PERIOD: 14
          VOL_FLOOR_PCT: 0.0001

          TELEGRAM_ENABLED: 1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          STATE_PATH: monitor_state.json
        run: python btc_absdd_monitor.py

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-dashboard
          path: |
            btc_absdd_dashboard.png
            monitor_state.json
          if-no-files-found: ignore
